name: plugin-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin manifests
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
          python3 -c "import json; json.load(open('plugin/.claude-plugin/plugin.json'))"
      - name: Versions in lockstep
        run: |
          python3 - <<'PY'
          import json
          plugin = json.load(open('plugin/.claude-plugin/plugin.json'))["version"]
          market = json.load(open('.claude-plugin/marketplace.json'))["plugins"][0]["version"]
          version = open('VERSION').read().strip()
          assert plugin == market == version, f"version drift: plugin.json={plugin} marketplace.json={market} VERSION={version}"
          print("versions in lockstep:", plugin)
          PY
      - name: No global-install regressions
        run: |
          # The v2 invariant: the shipped payload never WRITES into ~/.claude.
          # The old check only looked for `cp` — it missed the mkdir/touch pair that
          # shipped in il-project step 13 for three releases. Match any write verb.
          if grep -rnE '(cp|mv|mkdir|touch|tee|rm|ln|install)[^|;&]*(~/\.claude|\$HOME/\.claude|\$\{HOME\}/\.claude)' \
               plugin/ --include="*.md" --include="*.sh" --include="*.py"; then
            echo "::error::plugin payload writes into ~/.claude — forbidden in v2"; exit 1
          fi
          if grep -rnE '>\s*"?(~/\.claude|\$HOME/\.claude)' plugin/ --include="*.md" --include="*.sh" --include="*.py"; then
            echo "::error::plugin payload redirects output into ~/.claude — forbidden in v2"; exit 1
          fi
          if grep -rn '"Bash(\*)"' plugin/ --include="*.py" --include="*.md"; then
            echo "::error::plugin payload grants Bash(*) — forbidden"; exit 1
          fi
          if grep -rniE 'human-token-tracker|il-telemetry' plugin/ .claude/; then
            echo "::error::telemetry belongs in the private edge8-telemetry plugin"; exit 1
          fi
          echo "no global-install or telemetry regressions"

      - name: Canonical team in lockstep across il-project, il-adopt and il-doctor
        run: |
          python3 - <<'PY'
          import glob, os, re, sys, pathlib
          # Three places hard-code the team: il-project step 6's gate, il-adopt
          # step 5's gate, and doctor.sh. Drift between them is how "found 6/8"
          # shipped, and how il-adopt kept an exact-count gate for a release
          # after il-project's was declared wrong.
          agents = sorted(os.path.basename(p)[:-3] for p in glob.glob(".claude/agents/*.md"))
          skills = sorted(glob.glob(".claude/skills/*/SKILL.md"))
          assert len(agents) == 4, f"expected 4 agents, found {len(agents)}: {agents}"
          assert len(skills) == 16, f"expected 16 skills, found {len(skills)}"
          read = lambda f: pathlib.Path(f).read_text(encoding="utf-8")
          DOCTOR, PROJECT, ADOPT = ("plugin/skills/il-doctor/scripts/doctor.sh",
                                    "plugin/skills/il-project/SKILL.md",
                                    "plugin/skills/il-adopt/SKILL.md")
          bad = []
          doc = read(DOCTOR)
          m = re.search(r'^CANON_AGENTS="([^"]+)"', doc, re.M)
          if not m or sorted(m.group(1).split()) != agents:
              bad.append(f"{DOCTOR}: CANON_AGENTS={m and m.group(1)!r}, repo has {agents}")
          m = re.search(r'^MIN_SKILLS=(\d+)', doc, re.M)
          if not m or int(m.group(1)) != len(skills):
              bad.append(f"{DOCTOR}: MIN_SKILLS={m and m.group(1)}, repo has {len(skills)}")
          for f in (PROJECT, ADOPT):
              t = read(f)
              g = re.search(r'for a in ([^;\n]+); do\s*\n\s*\[ -f "\$TARGET/\.claude/agents/\$a\.md" \]', t)
              if not g:
                  bad.append(f"{f}: canonical-agent gate not found (exact-count gate crept back?)")
              elif sorted(g.group(1).split()) != agents:
                  bad.append(f"{f}: gate names {sorted(g.group(1).split())}, repo has {agents}")
              c = re.search(r'\[ "\$S" -ge (\d+) \]', t)
              if not c or int(c.group(1)) != len(skills):
                  bad.append(f"{f}: skills gate {c and c.group(1)}, repo has {len(skills)}")
          # The retired v2.4 set must be the same list everywhere it is migrated or detected.
          def retired(f):
              t = read(f)
              a = re.search(r'RETIRED_AGENTS="([^"]+)"', t)
              s = re.search(r'RETIRED_SKILLS="([^"]+)"', t)
              if not (a and s):
                  bad.append(f"{f}: RETIRED_AGENTS/RETIRED_SKILLS missing"); return None
              return (sorted(x.replace(".md", "") for x in a.group(1).split()),
                      sorted(s.group(1).replace("\\", " ").split()))
          sets = {f: retired(f) for f in (DOCTOR, PROJECT, ADOPT)}
          if None not in sets.values() and len({str(v) for v in sets.values()}) != 1:
              bad.append("retired v2.4 lists differ:\n" + "\n".join(f"  {k}: {v}" for k, v in sets.items()))
          ra, rs = sets[DOCTOR] or ([], [])
          for a in ra:
              if a in agents: bad.append(f"{a} is listed as retired but is a live agent")
          for s in rs:
              if os.path.isdir(f".claude/skills/{s}"): bad.append(f"{s} is listed as retired but still ships")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"{len(agents)} agents / {len(skills)} skills; gates, doctor thresholds and retired lists agree")
          PY

      - name: AGENT-DELEGATION block identical everywhere it is embedded
        run: |
          python3 - <<'PY'
          import difflib, glob, os, re, sys
          # The block is hand-duplicated in il-project step 7, il-adopt step 7 and
          # the scaffold's CLAUDE.md. Step 7 re-applies the skill's copy, so a
          # drifted template only misleads readers — but drift between the two
          # skills means /il-project and /il-adopt install different routing.
          files = ["plugin/skills/il-project/SKILL.md", "plugin/skills/il-adopt/SKILL.md",
                   "templates/project-scaffold/CLAUDE.md"]
          def block(f):
              t = open(f, encoding="utf-8").read()
              m = re.search(r'<!-- BEGIN: AGENT-DELEGATION.*?<!-- END: AGENT-DELEGATION -->', t, re.S)
              assert m, f"{f}: no AGENT-DELEGATION block"
              return m.group(0)
          ref = block(files[0]); bad = False
          for f in files[1:]:
              b = block(f)
              if b != ref:
                  bad = True
                  print(f"--- {files[0]}\n+++ {f}")
                  print("\n".join(difflib.unified_diff(ref.splitlines(), b.splitlines(), lineterm="", n=1)))
          agents = sorted(os.path.basename(p)[:-3] for p in glob.glob(".claude/agents/*.md"))
          routed = sorted(re.findall(r'^\| \*\*([a-z-]+)\*\* \|', ref, re.M))
          if routed != agents:
              bad = True; print(f"block routes to {routed}, repo ships {agents}")
          if bad: sys.exit(1)
          print(f"delegation block identical in {len(files)} files; routes exactly the {len(agents)} shipped agents")
          PY

      - name: il-doctor parses and its layout checks fire
        run: |
          bash -n plugin/skills/il-doctor/scripts/doctor.sh
          bash .github/scripts/doctor-smoke.sh

      - name: Scaffold rules identical to the canonical rules; no global-install advice
        run: |
          # il-project step 6 / il-adopt step 5 copy these from .claude/rules/; the
          # template copies exist so a scaffold is coherent before step 6 runs. The
          # template's global-engineering.md had drifted 36 lines behind.
          for f in global-engineering.md agent-routing.md; do
            diff -u ".claude/rules/$f" "templates/project-scaffold/.claude/rules/$f" \
              || { echo "::error::templates/project-scaffold/.claude/rules/$f drifted from .claude/rules/$f — copy it over"; exit 1; }
          done
          if grep -rn '~/\.claude' .claude/rules/; then
            echo "::error::rules tell people to install something under ~/.claude — nothing installs globally in v2"; exit 1
          fi
          echo "scaffold rules match canonical; no global-install advice"

      - name: Placeholder substitution covers the template and survives awkward names
        run: |
          python3 - <<'PY'
          import glob, os, pathlib, re, shutil, subprocess, sys, tempfile
          skill = pathlib.Path("plugin/skills/il-project/SKILL.md").read_text(encoding="utf-8")
          step4 = skill.split("### Step 4")[1].split("### Step 5")[0]
          code = "\n".join(re.findall(r"```bash\n(.*?)```", step4, re.S))
          bad = []
          # 1. No value may be interpolated into the perl program — that is the
          #    "Team@Work" -> "Team" bug. Values travel via $ENV{...}.
          for prog in re.findall(r"perl -i -pe (['\"])(.*?)\1", code, re.S):
              if prog[0] == '"' or "$ENV{" not in prog[1] or re.search(r'\$[A-Z_]+\b(?!\{)', prog[1].replace("$ENV{", "")):
                  bad.append(f"il-project step 4 perl program interpolates a shell value: {prog[1].strip()!r}")
          adopt = pathlib.Path("plugin/skills/il-adopt/SKILL.md").read_text(encoding="utf-8")
          for prog in re.findall(r"perl -i -pe (['\"])(.*?)\1 <each", adopt, re.S):
              if prog[0] == '"' or "$ENV{" not in prog[1]:
                  bad.append(f"il-adopt step 8 perl program interpolates a shell value: {prog[1].strip()!r}")
          # 2. Tokens the step substitutes == tokens the template carries. A dead
          #    substitution (PH-author) and an unsubstituted token are both drift.
          subs = set(re.findall(r'\\Q(.+?)\\E', code))
          exts = ('.md', '.html', '.json', '.txt', '.example')
          tpl = set()
          for f in glob.glob("templates/project-scaffold/**/*", recursive=True):
              if not os.path.isfile(f) or "/website/" in f or not (f.endswith(exts) or os.path.basename(f) in ('.gitignore',) or os.path.basename(f).startswith('.env')):
                  continue
              t = open(f, encoding="utf-8", errors="ignore").read()
              tpl |= set(re.findall(r'\{[A-Z][A-Za-z -]*\}', t))
              if "YYYY-MM-DD" in t: tpl.add("YYYY-MM-DD")
          if subs != tpl:
              bad.append(f"step 4 substitutes {sorted(subs)} but the template carries {sorted(tpl)}")
          # 3. Run the step as written against the template with a hostile name.
          NAME = "Mom & Pop / Team@Work $5 \\ Books"
          tmp = tempfile.mkdtemp(); target = os.path.join(tmp, "proj")
          shutil.copytree("templates/project-scaffold", target, symlinks=True)
          run = re.sub(r'^export (PROJECT_NAME|PROJECT_SLUG|FIRST_DATE)=.*$', '', code, flags=re.M)
          env = dict(os.environ, TARGET=target, PROJECT_NAME=NAME, PROJECT_SLUG="mom-pop", FIRST_DATE="2031-02-03")
          r = subprocess.run(["bash", "-e", "-c", run], env=env, capture_output=True, text=True)
          if r.returncode != 0:
              bad.append(f"step 4 exited {r.returncode}:\n{r.stderr.strip()}")
          left = subprocess.run(["grep", "-rl", "{Project Name}", target, "--exclude-dir=website"], capture_output=True, text=True).stdout.split()
          if left: bad.append(f"{{Project Name}} still present after step 4 in: {left[:5]}")
          readme = open(os.path.join(target, "README.md"), encoding="utf-8").read()
          if NAME not in readme: bad.append(f"README.md does not contain the name verbatim after substitution: {NAME!r}")
          topics = subprocess.run(["grep", "-rl", "2031-02-03", os.path.join(target, "content/topics")], capture_output=True, text=True).stdout.split()
          if not topics: bad.append("FIRST_DATE was not substituted under content/topics")
          shutil.rmtree(tmp)
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"step 4 covers {sorted(subs)}; hostile name {NAME!r} substituted verbatim, nothing left behind")
          PY

      - name: Every skill has frontmatter whose name matches its directory
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          bad = []
          for f in sorted(glob.glob(".claude/skills/*/SKILL.md") + glob.glob("plugin/skills/*/SKILL.md")):
              t = open(f, encoding="utf-8").read()
              if not t.startswith("---\n"):
                  bad.append(f"{f}: no frontmatter"); continue
              fm = t.split("---\n", 2)[1]
              d = os.path.basename(os.path.dirname(f))
              m = re.search(r'^name:\s*(\S+)', fm, re.M)
              if not m:            bad.append(f"{f}: no name")
              elif m.group(1) != d: bad.append(f"{f}: name {m.group(1)} != dir {d}")
              if not re.search(r'^description:', fm, re.M): bad.append(f"{f}: no description")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all skill frontmatter valid")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Plan-protocol engine test suite
        run: |
          # A 35KB engine ships into every scaffolded project and its own suite
          # had never run in CI. node: builtins only — no install needed.
          node --test .claude/skills/plan-protocol/assets/plan.test.mjs

      - name: Plan-protocol ships no client-specific vocabulary
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          src = pathlib.Path(".claude/skills/plan-protocol/assets/plan.mjs").read_text()
          m = re.search(r'^\s*components:\s*\[(.*?)\]', src, re.M | re.S)
          assert m, "could not find the components default in plan.mjs"
          if m.group(1).strip():
              print("DEFAULT_CONFIG.components must ship empty — the engine imposes no")
              print(f"domain vocabulary. Found: [{m.group(1).strip()}]")
              sys.exit(1)
          print("components default is empty (opt-in taxonomy)")
          PY

      - name: Web template queries match its migrations
        run: |
          python3 - <<'PY'
          import re, glob, os, sys
          root = "templates/project-scaffold/website"

          def strip_comments(src):
              src = re.sub(r'/\*.*?\*/', '', src, flags=re.S)
              keep = []
              for line in src.split("\n"):
                  if re.match(r'\s*//', line): continue
                  keep.append(re.sub(r'(?<![:"\'/])//(?![/*]).*$', '', line))
              return "\n".join(keep)

          schema = {}
          for f in sorted(glob.glob(f"{root}/supabase/migrations/*.sql")):
              sql = open(f).read()
              for m in re.finditer(r'create table (?:if not exists )?(\w+)\s*\((.*?)\n\);', sql, re.S | re.I):
                  cols = set()
                  for line in m.group(2).split("\n"):
                      cm = re.match(r'^([a-z_][a-z0-9_]*)\s+\S', line.strip().rstrip(","))
                      if cm and cm.group(1) not in ("primary","unique","foreign","constraint","check"):
                          cols.add(cm.group(1))
                  schema[m.group(1)] = cols

          bad, sites = [], 0
          for f in glob.glob(f"{root}/**/*.ts*", recursive=True):
              if not os.path.isfile(f): continue
              src = strip_comments(open(f, encoding="utf-8").read())
              for m in re.finditer(r"\.from\(\s*['\"](\w+)['\"]\s*\)((?:\s*\.\w+\([^)]*\))*)", src):
                  tbl, chain = m.group(1), m.group(2)
                  sites += 1
                  if tbl not in schema:
                      bad.append(f"{f}: table '{tbl}' has no migration"); continue
                  cols = []
                  sel = re.search(r"\.select\(\s*['\"]([^'\"]*)['\"]", chain)
                  if sel: cols += [c.strip().split(':')[0] for c in sel.group(1).split(',')]
                  cols += [o.group(1) for o in re.finditer(r"\.(?:eq|neq|gt|gte|lt|lte|is|order|in)\(\s*['\"](\w+)['\"]", chain)]
                  for c in (c.strip() for c in cols):
                      if c and c != '*' and '(' not in c and c not in schema[tbl]:
                          bad.append(f"{f}: {tbl}.{c} is not in the migration")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"{sites} query sites checked against {len(schema)} tables — all resolve")
          PY

      - name: Web template env vars are all documented
        run: |
          python3 - <<'PY'
          import re, glob, os, sys, pathlib
          root = "templates/project-scaffold/website"
          ex = pathlib.Path(f"{root}/.env.local.example")
          if not ex.exists():
              print(f"{ex} is missing — it is the authoritative env list"); sys.exit(1)
          documented = set(re.findall(r'^([A-Z][A-Z0-9_]*)=', ex.read_text(), re.M))
          used = {}
          for f in glob.glob(f"{root}/**/*.ts*", recursive=True):
              if not os.path.isfile(f): continue
              for m in re.finditer(r'process\.env\.([A-Z][A-Z0-9_]*)', open(f, encoding="utf-8").read()):
                  used.setdefault(m.group(1), set()).add(f)
          runtime = {"NODE_ENV"}          # set by the runtime, never by the operator
          missing = sorted(set(used) - documented - runtime)
          if missing:
              print("read by the app but absent from .env.local.example:")
              for v in missing:
                  print(f"  {v}  ({', '.join(sorted(used[v]))})")
              sys.exit(1)
          stale = sorted(documented - set(used))
          if stale:
              print("documented but never read — remove or wire up:")
              print("\n".join("  " + v for v in stale)); sys.exit(1)
          print(f"{len(documented)} env vars documented, all read; none stale")
          PY

      - name: Web template RLS hygiene
        run: |
          python3 - <<'PY'
          import glob, re, sys
          bad = []

          def strip_sql_comments(src):
              # -- comments explain the rules; they must not be scanned FOR the rules
              src = re.sub(r'/\*.*?\*/', '', src, flags=re.S)
              return "\n".join(re.sub(r'--.*$', '', line) for line in src.split("\n"))

          for f in sorted(glob.glob("templates/project-scaffold/website/supabase/migrations/*.sql")):
              sql = strip_sql_comments(open(f).read())
              name = f.split("/")[-1]
              for t in re.findall(r'create table (?:if not exists )?(\w+)', sql, re.I):
                  if not re.search(rf'alter table {t} enable row level security', sql, re.I):
                      bad.append(f"{name}: table '{t}' never enables row level security")
              # bare auth.uid() re-evaluates per row; (select auth.uid()) is an initplan
              for m in re.finditer(r'(?<!select )auth\.uid\(\)', sql):
                  ctx = sql[max(0, m.start()-40):m.start()+15].replace("\n", " ")
                  bad.append(f"{name}: bare auth.uid() — wrap as (select auth.uid()): ...{ctx.strip()}")
              for m in re.finditer(r'create policy[^;]+;', sql, re.S | re.I):
                  if 'to authenticated' not in m.group(0):
                      pol = re.search(r'create policy\s+"([^"]+)"', m.group(0))
                      bad.append(f"{name}: policy {pol.group(1) if pol else '?'} is not scoped `to authenticated`")
          if bad:
              print("\n".join("  " + b for b in bad)); sys.exit(1)
          print("RLS enabled on every table; policies scoped and initplan-safe")
          PY

      - name: Web template dependencies are all declared by il-project step 9c
        run: |
          python3 - <<'PY'
          import glob, os, re, sys, pathlib
          # Everything the starter kit imports must be installed by step 9c or come
          # from create-next-app. `unified` was imported but never installed and only
          # resolved by accidental npm hoisting.
          root = "templates/project-scaffold/website"
          pkgs = set()
          for f in glob.glob(f"{root}/**/*.ts*", recursive=True):
              if not os.path.isfile(f): continue
              for m in re.finditer(r'''(?:from\s+|require\(|import\()\s*['"]([^'"]+)['"]''',
                                   open(f, encoding="utf-8").read()):
                  s = m.group(1)
                  if s.startswith(('.', '@/', '~/', 'node:')): continue
                  p = s.split('/')
                  pkgs.add('/'.join(p[:2]) if s.startswith('@') else p[0])
          skill = pathlib.Path("plugin/skills/il-project/SKILL.md").read_text()
          blk = re.search(r'# 9c\..*?```', skill, re.S).group(0)
          declared = set(re.findall(r'@?[\w][\w@/.-]+', blk))
          from_cna = {"next", "react", "react-dom", "typescript", "eslint", "tailwindcss"}
          missing = sorted(pkgs - declared - from_cna)
          if missing:
              print("imported by the web template but not installed by step 9c:")
              print("\n".join("  " + m for m in missing)); sys.exit(1)
          print(f"all {len(pkgs)} template imports are declared")
          PY
